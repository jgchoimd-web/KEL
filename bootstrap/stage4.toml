# kel first installs every package of repo-stage4 into an empty root with
# KEL's apk; this script then runs inside that root (read-only, only
# $KEL_WORKDIR writable): the rebuilt system works on its own.
[verify]
script = '''
cd "$KEL_WORKDIR"
. /etc/os-release && echo "rebuilt root: $PRETTY_NAME (ID=$ID)"
test "$ID" = kel
case "$KEL_ARCH" in
  x86_64)  interp=/lib64/ld-linux-x86-64.so.2 ;;
  aarch64) interp=/lib/ld-linux-aarch64.so.1 ;;
esac
# The rebuilt toolchain builds working programs (LFS 13.1 chapter 8.32 checks).
echo 'int main(){}' | cc -x c - -v -Wl,--verbose > dummy.log 2>&1
readelf -l a.out | grep -q "Requesting program interpreter: $interp"
grep -q 'attempt to open /usr/lib/libc.so.6 succeeded' dummy.log
printf '#include <iostream>\nint main(){std::cout << "c++ ok" << std::endl;}\n' > t.cc
g++ t.cc -o t && ./t
# Only KEL's compiler may appear in the binaries (no host toolchain traces).
for f in /usr/bin/bash /usr/bin/gcc /usr/bin/python3 /usr/bin/apk /usr/lib/libc.so.6 /usr/lib/libstdc++.so.6; do
  c=$(readelf -p .comment "$f" | grep -o 'GCC: ([^)]*) [0-9.]*' | sort -u | tr '\n' ' ')
  echo "$f: $c"
  case "$c" in *Ubuntu*|*Debian*) echo "host compiler trace in $f"; exit 1;; esac
done
for t in apk bwrap make meson ninja perl python3 openssl; do
  command -v "$t" > /dev/null || { echo "missing $t"; exit 1; }
done
python3 -c 'import ssl, sqlite3, decimal, zlib, bz2, lzma, ctypes; print("python modules ok")'
echo "STAGE4 VERIFY OK"
'''
