# Stage 4: self-hosting rebuild (docs/DESIGN.md sections 5 and 5.4).
# One build root is composed from the stage 3 repository by KEL's own apk
# (the one in the sysroot) and mounted read-only as / for every build, so
# only KEL packages take part: nothing from the host or the bootstrap tools.
# The packages go to a new repository, created and signed with the same apk;
# nothing is installed anywhere.
#
# The steps are the package steps of stage3b.toml in the same order
# (tools/tests/test_buildroot.py checks this).

[stage]
name = "stage4"
summary = "self-hosting rebuild: every package again, in a root made only of stage 3 packages"
kind = "rebuild"
input_repo = "repo"
output_repo = "repo-stage4"
tools_root = "sysroot"
config_site = true

