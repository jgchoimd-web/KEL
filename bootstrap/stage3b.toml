# Stage 3b: the final base system as packages (docs/DESIGN.md section 5,
# LFS 13.1-systemd chapter 8 plus KEL's own tools). Every step builds a
# recipe's [build] section inside the stage 3a root, packages DESTDIR as a
# signed apk into work/<arch>/repo/<arch>, and copies the package over the
# root so later steps build against it. Not built (see docs/DECISIONS.md and
# the recipes' comments): man-pages, inetutils, groff, GRUB (KEL boots with
# systemd-boot), kbd, libpipeline, Vim, D-Bus, man-db (Phase 3 boot image),
# XML::Parser and Intltool (dropped in LFS 13.1).

[stage]
name = "stage3b"
summary = "final base system packages (LFS 13.1 chapter 8) and KEL's apk-tools and bubblewrap"
root = "sysroot"
config_site = true

