[verify]
script = '''
cd "$KEL_WORKDIR"
# Toolchain sanity checks from LFS 13.1 chapter 8.32.
echo 'int main(){}' | cc -x c - -v -Wl,--verbose > dummy.log 2>&1
readelf -l a.out | grep -q '\[Requesting program interpreter: /lib64/ld-linux-x86-64.so.2\]'
grep -E -o '/usr/lib.*/S?crt[1in].*succeeded' dummy.log
grep -q 'attempt to open /usr/lib/libc.so.6 succeeded' dummy.log
gcc -dumpmachine | grep -qx "$KEL_TARGET"
printf '#include <iostream>\nint main(){std::cout << "c++ ok" << std::endl;}\n' > t.cc
g++ t.cc -o t && ./t
# Only KEL's compiler may appear in the binaries (no host toolchain traces).
for f in /usr/bin/bash /usr/bin/gcc /usr/bin/python3 /usr/bin/apk /usr/lib/libc.so.6 /usr/lib/libstdc++.so.6; do
  c=$(readelf -p .comment "$f" | grep -o 'GCC: ([^)]*) [0-9.]*' | sort -u | tr '\n' ' ')
  echo "$f: $c"
  case "$c" in *Ubuntu*|*Debian*) echo "host compiler trace in $f"; exit 1;; esac
done
for t in apk bwrap meson ninja pkg-config perl python3 openssl systemctl udevadm kmod mkfs.ext4 tclsh expect runtest; do
  command -v "$t" > /dev/null || { echo "missing $t"; exit 1; }
done
python3 -c 'import ssl, sqlite3, decimal, zlib, bz2, lzma, ctypes, readline, ensurepip; print("python modules ok")'
openssl version
# KEL's own apk installs a working root from the new signed repository.
mkdir -p r/usr/bin r/usr/lib
ln -s usr/bin r/bin; ln -s usr/bin r/sbin; ln -s usr/lib r/lib; ln -s usr/lib r/lib64
ln -s bin r/usr/sbin; ln -s lib r/usr/lib64
apk --root "$PWD/r" --initdb --arch "$KEL_ARCH" --no-cache --keys-dir /kel/keys \
    -X /kel/repo/Packages.adb add filesystem bash coreutils
chroot r /usr/bin/bash -c '. /etc/os-release; echo "apk root: $PRETTY_NAME"; ls --version | head -1'
apk --root "$PWD/r" --keys-dir /kel/keys -X /kel/repo/Packages.adb info | sort | tr '\n' ' '
echo
echo "STAGE3B VERIFY OK"
'''
