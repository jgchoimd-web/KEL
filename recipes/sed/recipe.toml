[package]
name = "sed"
version = "4.10"
revision = 0
summary = "GNU stream editor"
license = "GPL-3.0-or-later"
homepage = "https://www.gnu.org/software/sed/"

[[source]]
url = "https://ftp.gnu.org/gnu/sed/sed-4.10.tar.xz"
sha256 = "b8e72182b2ec96a3574e2998c47b7aaa64cc20ce000d8e9ac313cc07cecf28c7"
signature = "https://ftp.gnu.org/gnu/sed/sed-4.10.tar.xz.sig"
signing_keys = ["155D3FC500C834486D1EEA677FD9FCCB000BEEEE"]  # Jim Meyering

# Stage 2: cross compiled temporary tool, installed into the sysroot.
# Based on LFS 12.4 chapter 6.
[bootstrap.stage2]
script = '''
./configure --prefix=/usr \
            --host="$KEL_TARGET" \
            --build="$(./build-aux/config.guess)"
make
make DESTDIR="$KEL_SYSROOT" install
'''
