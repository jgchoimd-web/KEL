[package]
name = "psmisc"
version = "23.7"
revision = 0
summary = "Utilities that use the proc file system (fuser, killall, pstree, ...)"
license = "GPL-2.0-or-later"
homepage = "https://gitlab.com/psmisc/psmisc"

# Release files are published on SourceForge (linked from the GitLab
# project); the sha256 also matches the one SourceForge lists for the file.
[[source]]
url = "https://downloads.sourceforge.net/project/psmisc/psmisc/psmisc-23.7.tar.xz"
sha256 = "58c55d9c1402474065adae669511c191de374b0871eec781239ab400b907c327"
signature = "https://downloads.sourceforge.net/project/psmisc/psmisc/psmisc-23.7.tar.xz.asc"
signing_keys = ["5D2FB320B825D93904D205193938F96BDF50FEA5"]  # Craig Small

# Package. Based on LFS 13.1 chapter 8.35. The test suite uses DejaGnu.
[build]
style = "gnu-configure"
depends = ["ncurses", "dejagnu"]
