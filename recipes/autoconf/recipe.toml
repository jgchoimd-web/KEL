[package]
name = "autoconf"
version = "2.73"
revision = 0
summary = "GNU tools that produce shell scripts to configure source code"
license = "GPL-3.0-or-later AND GPL-3.0-or-later WITH Autoconf-exception-3.0"
homepage = "https://www.gnu.org/software/autoconf/"
# autoconf, autoheader, autom4te, ... are Perl scripts that run GNU m4.
depends = ["m4", "perl"]

[[source]]
url = "https://ftp.gnu.org/gnu/autoconf/autoconf-2.73.tar.xz"
sha256 = "9fd672b1c8425fac2fa67fa0477b990987268b90ff36d5f016dae57be0d6b52e"
signature = "https://ftp.gnu.org/gnu/autoconf/autoconf-2.73.tar.xz.sig"
signing_keys = ["82F854F3CE73174B8B63174091FCC32B6769AA64"]  # Zack Weinberg

# Package. Based on LFS 13.1 chapter 8.47. KEL deviation: the autotest
# suite runs with $KEL_JOBS parallel jobs (it runs serially by default).
[build]
style = "gnu-configure"
depends = ["m4", "perl"]
test = '''
cd build
make check TESTSUITEFLAGS="-j$KEL_JOBS"
'''
