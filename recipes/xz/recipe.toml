[package]
name = "xz"
version = "5.8.4"
revision = 0
summary = "XZ Utils and liblzma"
license = "0BSD AND GPL-2.0-or-later AND LGPL-2.1-or-later"
homepage = "https://tukaani.org/xz/"

[[source]]
url = "https://github.com/tukaani-project/xz/releases/download/v5.8.4/xz-5.8.4.tar.xz"
sha256 = "4ce24038fd4221e0d13bc1a2de7a4db56e90b92b3bf75321f6c14be73f65de4b"
signature = "https://github.com/tukaani-project/xz/releases/download/v5.8.4/xz-5.8.4.tar.xz.sig"
signing_keys = ["3690C240CE51B4670D30AD1C38EE757D69184620"]  # Lasse Collin

# Stage 2: cross compiled temporary tool, installed into the sysroot.
# Based on LFS 13.1 chapter 6.
[bootstrap.stage2]
script = '''
./configure --prefix=/usr \
            --host="$KEL_TARGET" \
            --build="$(build-aux/config.guess)" \
            --disable-static \
            --docdir="/usr/share/doc/xz-$KEL_VERSION_XZ"
make
make DESTDIR="$KEL_SYSROOT" install
rm -v "$KEL_SYSROOT/usr/lib/liblzma.la"
'''

# Package. Based on LFS 13.1 chapter 8.8 (KEL: unversioned docdir).
[build]
style = "gnu-configure"
configure_args = ["--disable-static"]
