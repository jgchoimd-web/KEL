[package]
name = "gettext"
version = "1.0"
revision = 0
summary = "GNU internationalization utilities and libintl"
license = "GPL-3.0-or-later AND LGPL-2.1-or-later"
homepage = "https://www.gnu.org/software/gettext/"

[[source]]
url = "https://ftp.gnu.org/gnu/gettext/gettext-1.0.tar.xz"
sha256 = "71132a3fb71e68245b8f2ac4e9e97137d3e5c02f415636eb508ae607bc01add7"
signature = "https://ftp.gnu.org/gnu/gettext/gettext-1.0.tar.xz.sig"
signing_keys = ["E0FFBD975397F77A32AB76ECB6301D9E1BBEAC08"]  # Bruno Haible

# Stage 3: only the three programs other packages need, inside the new root.
# Based on LFS 13.1 chapter 7.7.
[bootstrap.stage3]
script = '''
./configure --disable-shared
make
cp -v gettext-tools/src/{msgfmt,msgmerge,xgettext} /usr/bin
'''

# Package. Based on LFS 13.1 chapter 8.36. LFS's --docdir is dropped
# (unversioned docs). The license directory is filled here because the LGPL
# text (libintl, libasprintf) is not at the top of the source tree (kel only
# copies the top-level COPYING* files). libtextstyle uses ncurses; ACL
# support comes from acl.
[build]
style = "gnu-configure"
configure_args = ["--disable-static"]
depends = ["ncurses", "acl"]
post_install = '''
chmod -v 0755 "$DESTDIR"/usr/lib/preloadable_libintl.so
install -vDm644 -t "$DESTDIR"/usr/share/licenses/gettext COPYING gettext-runtime/intl/COPYING.LIB
'''
