[package]
name = "binutils"
version = "2.47"
revision = 0
summary = "GNU assembler, linker and binary utilities"
license = "GPL-3.0-or-later"
homepage = "https://www.gnu.org/software/binutils/"

[[source]]
url = "https://sourceware.org/pub/binutils/releases/binutils-2.47.tar.xz"
sha256 = "154ab23b60070e8f27013c22977f1129425d67d1e8acd6e13010e617811e4cff"
signature = "https://sourceware.org/pub/binutils/releases/binutils-2.47.tar.xz.sig"
signing_keys = ["3A24BC1E8FB409FA9F14371813FCEF89DD9E3C4F"]  # Nick Clifton

# Stage 1: cross binutils for $KEL_TARGET, installed into the sysroot's /tools.
# Based on LFS 12.4 chapter 5.2.
[bootstrap.pass1]
script = '''
mkdir -v build
cd build
../configure \
    --prefix="$KEL_TOOLS" \
    --with-sysroot="$KEL_SYSROOT" \
    --target="$KEL_TARGET" \
    --disable-nls \
    --enable-gprofng=no \
    --disable-werror \
    --enable-new-dtags \
    --enable-default-hash-style=gnu
make
make install
'''
