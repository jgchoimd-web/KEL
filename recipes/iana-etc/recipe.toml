[package]
name = "iana-etc"
version = "20261015"
revision = 0
summary = "Network services and protocols data (/etc/services, /etc/protocols)"
license = "CC0-1.0"
homepage = "https://github.com/Mic92/iana-etc"

# The files are generated from the IANA protocol registries, which IANA and
