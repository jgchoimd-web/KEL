[package]
name = "findutils"
version = "4.11.0"
revision = 0
summary = "GNU find, xargs and locate"
license = "GPL-3.0-or-later"
homepage = "https://www.gnu.org/software/findutils/"

[[source]]
url = "https://ftp.gnu.org/gnu/findutils/findutils-4.11.0.tar.xz"
sha256 = "bfd19cb06cc71f3352d567e90284d8cdac02ac89774bbeadf0b533b0c11432fd"
signature = "https://ftp.gnu.org/gnu/findutils/findutils-4.11.0.tar.xz.sig"
signing_keys = ["0CF4E8D871593224842832B888DD9E08C5DDACB9"]  # James Youngman

# Stage 2: cross compiled temporary tool, installed into the sysroot.
# Based on LFS 13.1 chapter 6.
[bootstrap.stage2]
script = '''
./configure --prefix=/usr \
            --localstatedir=/var/lib/locate \
            --host="$KEL_TARGET" \
            --build="$(build-aux/config.guess)"
make
make DESTDIR="$KEL_SYSROOT" install
'''

# Package. Based on LFS 13.1 chapter 8.63: the locate database lives in
# /var/lib/locate (make install creates the empty directory). No tests: LFS
# runs them as the unprivileged `tester` user, which the sandbox does not have.
[build]
style = "gnu-configure"
configure_args = ["--localstatedir=/var/lib/locate"]
check = false
