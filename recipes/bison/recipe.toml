[package]
name = "bison"
version = "3.8.2"
revision = 0
summary = "GNU parser generator"
license = "GPL-3.0-or-later"
homepage = "https://www.gnu.org/software/bison/"
depends = ["m4"]  # bison runs m4 at run time

# Signed with a DSA-1024 key over a SHA-1 digest (weak by today's standards);
# the sha256 pin is the primary check. Matches the bison-announce post.
[[source]]
url = "https://ftp.gnu.org/gnu/bison/bison-3.8.2.tar.xz"
sha256 = "9bba0214ccf7f1079c5d59210045227bcf619519840ebfa80cd3849cff5a5bf2"
signature = "https://ftp.gnu.org/gnu/bison/bison-3.8.2.tar.xz.sig"
signing_keys = ["7DF84374B1EE1F9764BBE25D0DDCAA3278D5264E"]  # Akim Demaille

# Stage 3. Based on LFS 13.1 chapter 7.8.
[bootstrap.stage3]
script = '''
./configure --prefix=/usr \
            --docdir="/usr/share/doc/bison-$KEL_VERSION_BISON"
make
make install
'''

# Package. Based on LFS 13.1 chapter 8.37. LFS's --docdir is dropped
# (unversioned docs). liby.a (the POSIX yacc library, which has no shared
# variant) is kept, as in LFS. bison runs m4 at run time ([package]
# depends); libtextstyle (gettext) gives colored diagnostics; flex, perl and
# readline are only used by the test suite.
[build]
style = "gnu-configure"
depends = ["m4", "gettext", "flex", "perl", "readline"]
