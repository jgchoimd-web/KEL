[package]
name = "grep"
version = "3.12"
revision = 0
summary = "GNU grep"
license = "GPL-3.0-or-later"
homepage = "https://www.gnu.org/software/grep/"

[[source]]
url = "https://ftp.gnu.org/gnu/grep/grep-3.12.tar.xz"
sha256 = "2649b27c0e90e632eadcd757be06c6e9a4f48d941de51e7c0f83ff76408a07b9"
signature = "https://ftp.gnu.org/gnu/grep/grep-3.12.tar.xz.sig"
signing_keys = ["155D3FC500C834486D1EEA677FD9FCCB000BEEEE"]  # Jim Meyering

# Stage 2: cross compiled temporary tool, installed into the sysroot.
# Based on LFS 13.1 chapter 6.
[bootstrap.stage2]
script = '''
./configure --prefix=/usr \
            --host="$KEL_TARGET" \
            --build="$(./build-aux/config.guess)"
make
make DESTDIR="$KEL_SYSROOT" install
'''
