[package]
name = "gzip"
version = "1.15"
revision = 0
summary = "GNU gzip compression utility"
license = "GPL-3.0-or-later"
homepage = "https://www.gnu.org/software/gzip/"

[[source]]
url = "https://ftp.gnu.org/gnu/gzip/gzip-1.15.tar.xz"
sha256 = "9aa0cc780dec156b8282844833b342ab7cb08c25d2cd9a1869cdd0df31deff48"
signature = "https://ftp.gnu.org/gnu/gzip/gzip-1.15.tar.xz.sig"
signing_keys = ["155D3FC500C834486D1EEA677FD9FCCB000BEEEE"]  # Jim Meyering

# Stage 2: cross compiled temporary tool, installed into the sysroot.
# Based on LFS 12.4 chapter 6.
[bootstrap.stage2]
script = '''
./configure --prefix=/usr --host="$KEL_TARGET"
make
make DESTDIR="$KEL_SYSROOT" install
'''
