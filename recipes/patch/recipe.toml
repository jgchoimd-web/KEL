[package]
name = "patch"
version = "2.8"
revision = 0
summary = "GNU patch"
license = "GPL-3.0-or-later"
homepage = "https://savannah.gnu.org/projects/patch/"

[[source]]
url = "https://ftp.gnu.org/gnu/patch/patch-2.8.tar.xz"
sha256 = "f87cee69eec2b4fcbf60a396b030ad6aa3415f192aa5f7ee84cad5e11f7f5ae3"
signature = "https://ftp.gnu.org/gnu/patch/patch-2.8.tar.xz.sig"
signing_keys = ["259B3792B3D6D319212CC4DCD5BF9FEB0313653A"]  # Andreas Gruenbacher

# Stage 2: cross compiled temporary tool, installed into the sysroot.
# Based on LFS 13.1 chapter 6.
[bootstrap.stage2]
script = '''
./configure --prefix=/usr \
            --host="$KEL_TARGET" \
            --build="$(build-aux/config.guess)"
make
make DESTDIR="$KEL_SYSROOT" install
'''
