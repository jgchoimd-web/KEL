[package]
name = "flex"
version = "2.6.4"
revision = 0
summary = "Fast lexical analyzer generator"
license = "BSD-3-Clause-flex"
homepage = "https://github.com/westes/flex"
depends = ["m4"]  # flex runs m4 (path found by configure) on every scanner

[[source]]
url = "https://github.com/westes/flex/releases/download/v2.6.4/flex-2.6.4.tar.gz"
sha256 = "e87aae032bf07c26f85ac0ed3250998c37621d95f8bd748b31f15b33c45ee995"
signature = "https://github.com/westes/flex/releases/download/v2.6.4/flex-2.6.4.tar.gz.sig"
signing_keys = ["56C67868E93390AA1039AD1CE4B29C8D64885307"]  # Will Estes

# Package. Based on LFS 13.1 chapter 8.16 (KEL: unversioned docdir). flex
# owns lex (a symlink, with its man page).
[build]
style = "gnu-configure"
depends = ["bison", "gettext", "m4", "texinfo"]
configure_args = ["--disable-static"]
post_install = '''
ln -sv flex "$DESTDIR"/usr/bin/lex
ln -sv flex.1 "$DESTDIR"/usr/share/man/man1/lex.1
'''
