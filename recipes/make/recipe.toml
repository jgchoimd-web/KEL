[package]
name = "make"
version = "4.4.1"
revision = 0
summary = "GNU make"
license = "GPL-3.0-or-later"
homepage = "https://www.gnu.org/software/make/"

[[source]]
url = "https://ftp.gnu.org/gnu/make/make-4.4.1.tar.gz"
sha256 = "dd16fb1d67bfab79a72f5e8390735c49e3e8e70b4945a15ab1f81ddb78658fb3"
signature = "https://ftp.gnu.org/gnu/make/make-4.4.1.tar.gz.sig"
signing_keys = ["6D4EEB02AD834703510B117680CB727A20C79BB2"]  # Paul D. Smith (signing subkey expired 2026-10-20; signature from 2023)

# Stage 2: cross compiled temporary tool, installed into the sysroot.
# Based on LFS 12.4 chapter 6.
[bootstrap.stage2]
script = '''
./configure --prefix=/usr \
            --host="$KEL_TARGET" \
            --build="$(build-aux/config.guess)"
make
make DESTDIR="$KEL_SYSROOT" install
'''
