# Package. Based on LFS 13.1 chapter 8.12. Differences: the six official
# upstream patches are applied first; LFS's input.c sed ("Fix a problem
# identified upstream") is dropped because readline83-001 makes the same
# change; unversioned docdir; the optional doc install is skipped. LFS's seds
# against the .old renaming and the rpath are kept. No test suite.
[build]
style = "gnu-configure"
depends = ["ncurses", "texinfo"]
check = false  # no test suite (LFS 13.1)
configure_args = ["--disable-static", "--with-curses"]
make_args = ["SHLIB_LIBS=-lncursesw"]
prepare = '''
for p in "$KEL_SOURCEDIR"/readline83-*; do
  patch -p0 -i "$p"
done
sed -i '/MV.*old/d' Makefile.in
sed -i '/{OLDSUFF}/c:' support/shlib-install
sed -i 's/-Wl,-rpath,[^ ]*//' support/shobj-conf
'''
